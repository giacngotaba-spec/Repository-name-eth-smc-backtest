- name: Diagnose ETH data
  run: |
    python - <<'PY'
    import pandas as pd

    f = "user_data/data/binance/ETH_USDT-5m.feather"
    df = pd.read_feather(f)

    print("CANDLES:", len(df))
    print("DATE TYPE:", df["date"].dtype)

    d = pd.to_datetime(df["date"], errors="coerce", utc=True)

    print("NaT:", d.isna().sum())

    # In 10 timestamp đầu/cuối dưới dạng raw
    print("\nRAW LAST 10:")
    print(df["date"].tail(10).to_string(index=False))

    print("\nRAW FIRST 10:")
    print(df["date"].head(10).to_string(index=False))
    PY