name: Test Freqtrade

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Freqtrade
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade

      - name: Check Freqtrade
        run: |
          freqtrade --version

      - name: Check Strategy
        run: |
          test -f user_data/strategies/ETH_SMC_ICT.py
          python -m py_compile user_data/strategies/ETH_SMC_ICT.py
          echo "STRATEGY OK"